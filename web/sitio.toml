# Textos de la página de presentación de Los Voyagers. Edita aquí y regenera la página:
#   uv run pipeline/build_web.py
#
# Los "mensaje" de cada canción son BORRADORES escritos a partir de las letras y de
# CONTEXT TO VOYAGERS/esencia_primer_disco.md. La banda debe cambiarlos por sus propias palabras.
# Colores, tempo, tonalidad, energía y letra sincronizada salen solos de los datos del proyecto.


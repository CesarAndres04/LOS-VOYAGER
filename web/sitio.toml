# ─── Un día-luz: la metáfora de la Voyager 1 (datos de la NASA, ver CONTEXT TO VOYAGERS/contex.md) ───
[senal]
texto = "La Voyager 1 salió en 1977 y nunca va a volver. Está tan lejos que su señal tarda casi un día entero en llegar a la Tierra, y aun así sigue llegando. Así se sienten nuestras canciones: irse lejos, perderse, y que lo único que vuelva sea la voz."
datos = [
  ["1977", "sale la Voyager 1; nunca va a volver"],
  ["24 h", "tarda su señal en llegar a la Tierra"],
  ["173", "veces la distancia Tierra–Sol: eso es un día-luz"],
  ["2", "instrumentos siguen encendidos para seguir viajando"],
]
dia_luz = "2026-11-18T10:16:07Z"


# ─── Epígrafes de las hojas sin canción ──────────────────────────────────────────────────
[epigrafes.mensaje]
texto = ["vox tantum atque ossa supersunt:", "vox manet […]", "omnibus auditur: sonus est, qui vivit in illa."]
lengua = "la"
traduccion = ["solo le quedan la voz y los huesos:", "la voz permanece […]", "todos la oyen: es un sonido lo que vive en ella."]
autor = "Ovidio"
obra = "Metamorfosis, III (el mito de Eco)"
anio = "c. 8 d. C."
lectura = "Eco se consume hasta que no le queda cuerpo, solo voz. Así existe hoy la Voyager 1 para nosotros: ya no se ve, solo se oye."

[epigrafes.banda]
texto = ["Mais les vrais voyageurs sont ceux-là seuls qui partent", "Pour partir ; cœurs légers, semblables aux ballons,", "[…] Et, sans savoir pourquoi, disent toujours : Allons !"]
lengua = "fr"
traduccion = ["Pero los verdaderos viajeros son solo los que parten", "por partir; corazones ligeros, semejantes a globos,", "[…] y, sin saber por qué, dicen siempre: ¡Vamos!"]
autor = "Charles Baudelaire"
obra = "Le Voyage, I (Les Fleurs du mal)"
obra_lengua = "fr"
anio = "1861"
lectura = "En francés, voyager es viajar. Los verdaderos viajeros parten por partir y, «sin saber por qué», siguen: el mismo «¿Por qué será?» de Vuelvo."

[epigrafes.senal]
texto = ["And you O my soul where you stand,", "Surrounded, detached, in measureless oceans of space,", "[…] Till the gossamer thread you fling catch somewhere, O my soul."]
lengua = "en"
traduccion = ["Y tú, alma mía, ahí donde estás,", "rodeada, desprendida, en océanos inmensurables de espacio,", "[…] hasta que el hilo de gasa que arrojas se prenda en algún sitio, oh alma mía."]
autor = "Walt Whitman"
obra = "A Noiseless Patient Spider"
obra_lengua = "en"
anio = "1868"
lectura = "Un alma suelta en el espacio que no deja de lanzar hilos hasta que uno se prenda. Como la sonda: sola, apagando instrumentos, sin dejar de transmitir."

# ─── Diccionario de a bordo: etimologías y lecturas (fuentes al final de la lista) ───────
# amarrar y vereda se verificaron por el extracto del DLE; confirmarlas a mano en dle.rae.es.
[diccionario]
titulo = "Palabras para perderse y volver"
intro = "Estas canciones se pueden leer como un solo viaje en cuatro tiempos. Primero, perderse: alguien se encuentra de pronto frente a una puerta que nadie abre, como en Vallejo. Después, volver, que no es llegar sino dar la vuelta: en latín, volver era hacer rodar, y en griego la misma palabra significa girar y regresar. Luego, decidir, que viene de cortar: el no que, como escribió Cavafis, es el correcto y aun así pesa toda la vida. Y al final, la voz, lo único que sobrevive a la distancia: la de Eco cuando ya no le queda cuerpo, el hilo que la araña de Whitman lanza al vacío y el nombre mismo de nuestra ciudad, Lima, que en quechua quiere decir «el que habla»."
fuentes = [
  ["RAE, DLE", "https://dle.rae.es/"],
  ["Etymonline", "https://www.etymonline.com/es/"],
  ["Garcilaso, Comentarios reales (1609)", "https://archive.org/details/loscomentariosre02vega"],
  ["Cerrón-Palomino sobre Rímac y Lima", "https://revistas.pucp.edu.pe/index.php/lexis/article/download/4946/4941"],
  ["Wikisource", "https://es.wikisource.org/"],
]

[[diccionario.entradas]]
palabra = "viaje"
cat = "m."
origen = "Del lat. viatĭcum, ‘provisión para el camino’. Del mismo origen, el francés voyage y voyager, ‘viajar’."
def = "Lo que uno lleva encima para no perderse del todo. Unos viajeros cargan pan; nosotros, canciones."
disco = "el nombre de la banda"

[[diccionario.entradas]]
palabra = "volver"
cat = "intr."
origen = "Del lat. volvĕre, ‘hacer rodar, voltear’. En griego, γυρίζω significa a la vez ‘girar’ y ‘regresar’."
def = "Dar la vuelta: describir una órbita y pasar otra vez por el mismo punto."
disco = "Vuelvo"

[[diccionario.entradas]]
palabra = "nostalgia"
cat = "f."
origen = "Del gr. nóstos, ‘regreso a casa’, y álgos, ‘dolor’. La inventó en 1688 Johannes Hofer, estudiante de medicina suizo, para nombrar el mal de los soldados lejos de su tierra."
def = "El dolor del regreso. A veces duele no poder volver; a veces, volver y ya no pertenecer."
disco = "Vuelvo"

[[diccionario.entradas]]
palabra = "amarrar"
cat = "tr."
origen = "Del fr. amarrer, y este del neerl. medio aanmarren, ‘atar’. Se dice de asegurar una embarcación en el puerto."
def = "Palabra de marineros: lo contrario de zarpar. «A tu cuerpo / que me amarra / y me desarma»."
disco = "Vuelvo"

[[diccionario.entradas]]
palabra = "decidir"
cat = "tr."
origen = "Del lat. decidĕre, ‘cortar’, ‘resolver’."
def = "Cortar. El corte es limpio y aun así duele: el no correcto que pesa toda la vida."
disco = "Decidido"

[[diccionario.entradas]]
palabra = "hola"
cat = "interj."
origen = "De origen incierto; los lingüistas todavía lo discuten."
def = "La primera palabra de una confesión, y nadie sabe de dónde viene. Como el «futuro incierto» al que se le dice hola."

[[diccionario.entradas]]
palabra = "eco"
cat = "m."
origen = "Del lat. echo, y este del gr. ēchṓ, ‘sonido’. En Ovidio, la ninfa que se consume de amor hasta que solo queda su voz."
def = "Una voz sin cuerpo que solo puede repetir las últimas palabras que oye: una voz condenada al «otra vez»."
disco = "el manifiesto"

[[diccionario.entradas]]
palabra = "planeta"
cat = "m."
origen = "Del gr. planḗtēs, ‘errante, vagabundo’. Dante llama al sol «pianeta / che mena dritto altrui per ogne calle»: el errante que guía."
def = "Una estrella que se perdió. Y aun así, la que guía."
disco = "Un día-luz"

[[diccionario.entradas]]
palabra = "Lima"
cat = "n. p."
origen = "Del quechua rimaq, ‘el que habla’. El Inca Garcilaso (1609): «El nombre Rimac es participio de presente, quiere decir el que habla»."
def = "Una ciudad que se llama «el que habla». En el quechua de la costa la r sonaba l: el nombre nos llegó cambiado, como una señal con ruido."
disco = "la voz"

[[diccionario.entradas]]
palabra = "vereda"
cat = "f."
origen = "Del lat. medieval vereda, ‘camino’, y este del lat. verēdus, ‘caballo de posta’."
def = "Antes de ser la orilla de la pista, fue el camino de los mensajeros: una vía hecha para que llegue una señal."
disco = "la calle de nuestras letras"

[[diccionario.entradas]]
palabra = "sueño"
cat = "m."
origen = "Del lat. somnus, ‘el acto de dormir’, y somnium, ‘lo soñado’. El español juntó las dos palabras en una."
def = "El que duerme y el que imagina, en la misma palabra. Calderón: «soñemos, alma, soñemos / otra vez»."


# ─── El regreso: lo que viene, sin anunciar nombres ─────────────────────────────────────
# La Voyager 1 nunca vuelve; Los Voyagers sí. La cápsula de la banda baja hacia la Tierra: salió con el debut
# (Vuelvo) y aterriza con el LP. Su posición en el dibujo es el avance real entre esas dos fechas.
[lp]
titulo = "Los Voyagers 1"
tipo = "LP"
frase = "La Voyager 1 nunca va a volver. Nosotros sí."
texto = "Mandamos la cápsula de vuelta a la Tierra. Adentro vamos los cuatro, con lo que grabamos allá arriba. Mientras bajamos, sintoniza lo que ya llegó."
debut = "2025-10-17T00:00:00-05:00"
debut_texto = "despegue · Vuelvo · 17.10.2025"
# FECHA REFERENCIAL: cambiarla cuando la banda fije el lanzamiento del LP.

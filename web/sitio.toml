# Cambiar `url` cuando haya dominio propio y volver a generar la página.
[sitio]
url = "https://los-voyagers.vercel.app"
titulo = "Los Voyagers — Rock peruano desde Lima | Vuelvo y Decidido"
descripcion = "Los Voyagers es una banda de rock alternativo de Lima, Perú. Escucha «Decidido» y «Vuelvo» en Spotify, Apple Music y YouTube. Perderse y volver."
titulo_social = "Los Voyagers — Rock peruano desde Lima"
descripcion_social = "Banda de rock de Lima, Perú. Singles «Vuelvo» y «Decidido». Perderse y volver."
descripcion_banda = "Banda de rock de Lima, Perú. Cuatro integrantes; rock alternativo, indie y rock latino en español."
desambiguacion = "Banda de rock peruana de Lima (Los Voyagers, en plural). No confundir con las sondas Voyager de la NASA, la película «Voyagers» (2021), la banda australiana Voyager ni el proyecto «Los Voyager»."
generos = ["Rock", "Rock alternativo", "Indie rock", "Rock latino", "Rock en español"]
imagen = "og.jpg"
imagen_alt = "Portada del fanzine de Los Voyagers, banda de rock peruano de Lima, impresa sobre papel fotocopiado"
linktree = "https://linktr.ee/losvoyagers"

[banda]
nombre = "Los Voyagers"
lema = "Rock peruano desde Lima"
saludo = "Perderse y volver."
manifiesto = "Alguien se pierde tan lejos que ya no puede volver. Lo único que vuelve es su voz."
presentacion = "Somos Los Voyagers, una banda de rock de Lima. Como la Voyager 1, que lleva casi 50 años alejándose y aun así sigue mandando su señal, cada canción nuestra es un mensaje lanzado sin saber si va a llegar. Hablamos de perderse, de volver y de decidir. Toda la bulla 🚀"
# BORRADOR para que la banda lo reescriba. Solo usa hechos publicados (ver banda/INVENTARIO.md).
bio = "Somos cuatro y somos de Lima. Tocamos por primera vez en octubre de 2023 y desde entonces subimos ensayos, covers y tocadas a TikTok: del Bar El Dragón, en Barranco, a la vereda. En 2025 salió Vuelvo; en 2026, Decidido. Lo que viene se está escribiendo. Toda la bulla 🚀"
cinta = ["Rock peruano", "Desde Lima", "Perderse y volver", "Toda la bulla 🚀", "Indie · alternativo · rock latino"]
datos = [["17·10·25", "despegue: Vuelvo"], ["Lima", "Perú"], ["2", "singles"], ["4", "integrantes"]]

